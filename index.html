<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anatomy Prompts</title>
    <meta name="description" content="Готовые промты для skill /anatomy: изометрические SVG, HTML и WebGL-фигуры, которые объясняют идею как настоящий механизм." />
    <script>
      // Тема до первой отрисовки, чтобы не мигало
      try {
        const t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="#/">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2 21 7v10l-9 5-9-5V7z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 12 21 7M12 12v10M12 12 3 7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        <span>Anatomy Prompts</span>
      </a>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Сменить тему">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 7a5 5 0 0 1 0 10z" fill="currentColor"/></svg>
      </button>
    </header>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
